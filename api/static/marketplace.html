<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YiThume — Marketplace</title>
  <meta name="description" content="Browse items across YiThume stores by category. Shop online, then confirm via WhatsApp." />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{ --emerald-600:#059669; --emerald-500:#10b981; }
    .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  </style>
</head>

<body class="min-h-screen bg-gradient-to-b from-white to-slate-50 text-slate-900">

  <!-- Header (matches landing style) -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <svg width="36" height="36" viewBox="0 0 36 36" class="rounded-2xl" aria-label="YiThume logo">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
          <rect rx="12" width="36" height="36" fill="url(#g)"/>
          <path d="M10 10h4l4 4 4-4h4l-8 8v8h-4v-8z" fill="#fff"/>
        </svg>
        <div class="leading-tight">
          <div class="font-semibold">YiThume</div>
          <div class="text-xs text-slate-500 -mt-0.5">Marketplace</div>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="/" class="hidden sm:inline-flex px-3 py-2 rounded-xl text-sm border border-slate-200 bg-white hover:bg-slate-50">Back to Home</a>
        <a href="/dashboard" class="inline-flex px-3 py-2 rounded-xl text-sm bg-emerald-600 text-white hover:bg-emerald-700">Login</a>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight">Browse the Marketplace</h1>
        <p class="text-slate-600 mt-1">Items uploaded by sellers across categories. Shop online, then confirm in WhatsApp.</p>
      </div>
      <div class="w-full sm:w-[420px]">
        <label class="text-xs text-slate-500">Search</label>
        <div class="mt-1 flex gap-2">
          <input id="q" class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-200" placeholder="Search items, categories, stores..." />
          <button id="btnSearch" class="px-4 py-3 rounded-2xl bg-slate-900 text-white hover:bg-black">Go</button>
        </div>
      </div>
    </div>

    <!-- Category chips -->
    <div class="mt-6">
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium">Categories</div>
        <div id="count" class="text-xs text-slate-500">Loading…</div>
      </div>
      <div id="cats" class="mt-3 flex flex-wrap gap-2"></div>
    </div>

    <!-- Grid -->
    <div class="mt-6">
      <div id="state" class="hidden px-4 py-3 rounded-2xl border border-slate-200 bg-white text-sm text-slate-600"></div>
      <div id="grid" class="mt-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white/70">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-sm text-slate-600 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>© <span id="yr"></span> YiThume</div>
      <div class="text-xs">Tip: Sellers can upload products via CSV and instantly appear here under categories.</div>
    </div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = $("state");
    const grid = $("grid");
    const cats = $("cats");
    const countEl = $("count");
    const qInput = $("q");

    const API_BASE = (window.location.origin || "").replace(/\/$/, "");
    const ENDPOINT = API_BASE + "/v1/marketplace/products";

    let currentCategory = "";

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function money(x, ccy){
      const n = Number(x || 0);
      if (!isFinite(n)) return "";
      const cur = (ccy || "ZAR");
      try { return new Intl.NumberFormat(undefined, { style:"currency", currency:cur, maximumFractionDigits: 2 }).format(n); }
      catch(e){ return `${cur} ${n.toFixed(2)}`; }
    }

    function setState(msg, show=true){
      if(!show){ state.classList.add("hidden"); state.textContent = ""; return; }
      state.classList.remove("hidden");
      state.textContent = msg;
    }

    function chip(label, active, onClick){
      const b = document.createElement("button");
      b.className = "px-3 py-1.5 rounded-full text-sm border " + (active ? "border-emerald-300 bg-emerald-50 text-emerald-900" : "border-slate-200 bg-white hover:bg-slate-50");
      b.textContent = label;
      b.onclick = onClick;
      return b;
    }

    function card(p){
      const img = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" class="w-full h-44 object-cover rounded-2xl bg-slate-100" />` :
        `<div class="w-full h-44 rounded-2xl bg-gradient-to-br from-slate-100 to-slate-50 border border-slate-200 flex items-center justify-center text-slate-400 text-sm">No image</div>`;

      const storeLine = p.store_public_url
        ? `<a class="text-xs text-emerald-700 hover:underline" href="${esc(p.store_public_url)}">${esc(p.store_name || "Store")} →</a>`
        : `<div class="text-xs text-slate-500">${esc(p.store_name || "Store")}</div>`;

      return `
        <div class="p-4 rounded-3xl border border-slate-200 bg-white hover:shadow-sm transition">
          ${img}
          <div class="mt-3 flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="font-semibold truncate">${esc(p.name || "Item")}</div>
              <div class="text-xs text-slate-500 mt-0.5">${esc(p.category || "General")}</div>
            </div>
            <div class="shrink-0 text-sm font-semibold">${esc(money(p.price, p.currency))}</div>
          </div>
          ${p.description ? `<div class="mt-2 text-sm text-slate-600 clamp2">${esc(p.description)}</div>` : ``}
          <div class="mt-3 flex items-center justify-between">
            ${storeLine}
            <button class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-sm hover:bg-black" onclick="alert('Tip: Buying flow is WhatsApp-first. Next: connect this card to a WhatsApp checkout / quote link.');">Buy</button>
          </div>
        </div>
      `;
    }

    function render({products=[], categories=[]}={}){
      countEl.textContent = `${products.length} item${products.length===1?'':'s'}`;
      cats.innerHTML = "";
      cats.appendChild(chip("All", !currentCategory, () => { currentCategory = ""; load(); }));
      (categories || []).forEach((c) => {
        const active = (currentCategory || "").toLowerCase() === String(c||"").toLowerCase();
        cats.appendChild(chip(c, active, () => { currentCategory = c; load(); }));
      });

      if(!products.length){
        grid.innerHTML = "";
        setState("No items yet. Upload products in the dashboard (CSV import) and they will appear here.");
        return;
      }
      setState("", false);
      grid.innerHTML = products.map(card).join("");
    }

    async function load(){
      try{
        setState("Loading marketplace…");
        const q = (qInput.value || "").trim();
        const url = new URL(ENDPOINT);
        if(q) url.searchParams.set("q", q);
        if(currentCategory) url.searchParams.set("category", currentCategory);
        url.searchParams.set("limit", "600");

        const res = await fetch(url.toString(), { headers: { "Accept": "application/json" }});
        const json = await res.json().catch(() => ({}));
        if(!res.ok || !json.ok){
          throw new Error(json.error || `HTTP ${res.status}`);
        }
        render(json);
      }catch(e){
        grid.innerHTML = "";
        setState(`Could not load marketplace: ${e.message || e}`);
        countEl.textContent = "—";
      }
    }

    $("btnSearch").addEventListener("click", load);
    qInput.addEventListener("keydown", (ev) => { if(ev.key === "Enter") load(); });
    $("yr").textContent = new Date().getFullYear();
    load();
  </script>
</body>
</html>
