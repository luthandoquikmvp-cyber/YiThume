<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YiThume Validator Admin Dashboard</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#081225;color:#e6eefc}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .card{background:#0f1b34;border:1px solid #1f2a44;border-radius:14px;padding:14px;margin:12px 0}
    input,button{width:100%;font-size:16px;border-radius:10px;border:1px solid #2a3960;background:#0b1630;color:#e6eefc;padding:10px;box-sizing:border-box}
    button{background:#16a34a;border:0;padding:12px;font-weight:800}
    button.secondary{background:#334155}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .kpi{background:#0b1630;border:1px solid #1f2a44;border-radius:12px;padding:10px}
    .muted{color:#9bb0d1}
    .log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}
    table{width:100%;border-collapse:collapse}
    td,th{border-bottom:1px solid #1f2a44;padding:8px;text-align:left;font-size:14px}
    @media (max-width:900px){.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h2 style="margin:6px 0 0">Validator Admin Dashboard</h2>
    <div class="muted" style="margin:6px 0 14px">Run ticks, register nodes, monitor consensus and commissions.</div>

    <div class="card">
      <label class="muted">Admin secret</label>
      <input id="adminSecret" placeholder="ADMIN_SECRET" />
      <div class="row" style="margin-top:10px">
        <button class="secondary" id="saveSecret">Save</button>
        <button id="refresh">Refresh</button>
      </div>
    </div>

    <div class="card">
      <div class="kpis">
        <div class="kpi"><div class="muted">Active nodes</div><div id="kNodes" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Queued jobs</div><div id="kQueued" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Assigned jobs</div><div id="kAssigned" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Validations/hr</div><div id="kVph" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Pending commissions</div><div id="kPending" style="font-size:20px;font-weight:800">—</div></div>
      </div>
      <div style="margin-top:10px" class="row">
        <button id="tick">Run Tick</button>
        <button class="secondary" id="registerNode">Register Node</button>
      </div>
      <div id="actionsBox" class="log" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="muted">Nodes</div>
      <div id="nodesBox" class="log"></div>
    </div>

    <div class="card">
      <div class="muted">Pending Commissions</div>
      <div id="commBox" class="log"></div>
    </div>

    <div class="card">
      <div class="muted">Disputes</div>
      <div id="dispBox" class="log"></div>
    </div>

    <div class="card">
      <div class="muted">Log</div>
      <div id="log" class="log"></div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const log = (m)=>{ $('log').textContent = (new Date()).toISOString() + "  " + m + "\n" + $('log').textContent; };
  const adminSecret = ()=> (localStorage.getItem('validator_admin_secret')||'').trim();

  const save = ()=>{
    localStorage.setItem('validator_admin_secret', $('adminSecret').value.trim());
    log("Saved admin secret.");
  };

  const hdrs = ()=>{
    const s = adminSecret();
    return {"Content-Type":"application/json", "X-Admin-Secret": s};
  };

  const refresh = async ()=>{
    const res = await fetch("/v1/validator/admin/metrics", {headers: hdrs()});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||"metrics failed");
    $('kNodes').textContent = j.nodes_active;
    $('kQueued').textContent = j.jobs.queued;
    $('kAssigned').textContent = j.jobs.assigned;
    $('kVph').textContent = j.validations_last_hour;
    $('kPending').textContent = j.pending_commissions;
    log("Metrics refreshed.");

    const nodes = await (await fetch("/v1/validator/admin/nodes", {headers: hdrs()})).json();
    $('nodesBox').textContent = JSON.stringify(nodes.items||[], null, 2);

    const comm = await (await fetch("/v1/validator/admin/commissions/pending", {headers: hdrs()})).json();
    $('commBox').textContent = JSON.stringify(comm.items||[], null, 2);

    const disp = await (await fetch("/v1/validator/admin/disputes", {headers: hdrs()})).json();
    $('dispBox').textContent = JSON.stringify(disp.items||[], null, 2);
  };

  const tick = async ()=>{
    const res = await fetch("/v1/validator/tick", {method:"POST", headers: hdrs(), body: JSON.stringify({max_store:5, max_tx:5})});
    const j = await res.json();
    $('actionsBox').textContent = JSON.stringify(j, null, 2);
    if(!j.ok) throw new Error(j.error||"tick failed");
    log("Tick ran. Enqueued stores=" + j.enqueued.stores + " tx=" + j.enqueued.transactions);
    await refresh();
  };

  const registerNode = async ()=>{
    const res = await fetch("/v1/validator/nodes/register", {method:"POST", headers: hdrs(), body: JSON.stringify({owner:"admin"})});
    const j = await res.json();
    $('actionsBox').textContent = JSON.stringify(j, null, 2);
    if(!j.ok) throw new Error(j.error||"register failed");
    log("Registered node. COPY NOW: node_id + node_secret (returned once).");
    await refresh();
  };

  $('saveSecret').addEventListener('click', save);
  $('refresh').addEventListener('click', ()=>refresh().catch(e=>log("ERR: "+e.message)));
  $('tick').addEventListener('click', ()=>tick().catch(e=>log("ERR: "+e.message)));
  $('registerNode').addEventListener('click', ()=>registerNode().catch(e=>log("ERR: "+e.message)));

  $('adminSecret').value = adminSecret();
})();
</script>
</body>
</html>
