<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YiThume — Dashboard</title>
<link rel="icon" href="/favicon.ico" />
<script src="/static/tailwind.js"></script>
<style>
  .tab-btn.active{background:#059669;color:#fff}
  .toast{animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .status-pill{font-size:.7rem;font-weight:600;padding:.2rem .55rem;border-radius:999px;white-space:nowrap}
  table{font-size:.82rem}
  th{font-weight:600;text-align:left;color:#64748b;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
  td,th{padding:.6rem .75rem;border-bottom:1px solid #e2e8f0;vertical-align:middle}
</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">

<!-- PIN gate -->
<div id="pinGate" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-2xl">
    <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-emerald-600 text-white text-xl font-bold">Y</span>
    <div class="mt-3 text-lg font-semibold">YiThume Dashboard</div>
    <div class="text-sm text-slate-500">Enter your admin PIN</div>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN"
           class="mt-4 w-full px-4 py-3 rounded-xl border border-slate-300 text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-500" />
    <button id="pinBtn" class="mt-3 w-full px-5 py-3 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">Unlock</button>
    <div id="pinMsg" class="mt-2 text-xs text-red-600"></div>
  </div>
</div>

<!-- Shell -->
<div id="shell" class="hidden min-h-screen">
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-600 text-white font-bold text-sm">Y</span>
        <b>YiThume</b><span class="text-slate-400 text-sm hidden sm:inline">/ Dashboard</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="storageBadge" class="hidden sm:inline text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500"></span>
        <a href="/" class="text-sm text-slate-600 hover:text-slate-900">Storefront ↗</a>
        <button id="lockBtn" class="text-sm px-3 py-1.5 rounded-lg border hover:bg-slate-100">Lock</button>
      </div>
    </div>
    <nav class="max-w-7xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto" id="tabs">
      <button data-tab="overview" class="tab-btn active px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Overview</button>
      <button data-tab="orders" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Orders</button>
      <button data-tab="products" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Products</button>
      <button data-tab="sellers" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Sellers</button>
      <button data-tab="runners" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Runners</button>
      <button data-tab="nodes" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Nodes</button>
      <button data-tab="marketplaces" class="tab-btn px-3.5 py-1.5 rounded-xl text-sm font-medium bg-slate-200 whitespace-nowrap">Marketplaces</button>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Overview -->
    <section id="tab-overview">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="statCards"></div>
      <div class="mt-6 grid md:grid-cols-2 gap-6">
        <div class="rounded-2xl bg-white border p-5">
          <b class="text-sm">Orders by status</b>
          <div id="statusBars" class="mt-4 space-y-2"></div>
        </div>
        <div class="rounded-2xl bg-white border p-5">
          <b class="text-sm">Top products</b>
          <div id="topProducts" class="mt-4 space-y-2 text-sm"></div>
        </div>
      </div>
      <div class="mt-6 rounded-2xl bg-white border p-5 overflow-x-auto">
        <b class="text-sm">Recent orders</b>
        <table class="w-full mt-3"><thead><tr><th>Code</th><th>Buyer</th><th>Items</th><th>Total</th><th>Status</th><th>When</th></tr></thead>
        <tbody id="recentOrders"></tbody></table>
      </div>
    </section>

    <!-- Orders -->
    <section id="tab-orders" class="hidden">
      <div class="flex flex-wrap items-center gap-2 mb-4" id="orderFilters"></div>
      <div class="rounded-2xl bg-white border p-5 overflow-x-auto">
        <table class="w-full"><thead><tr><th>Code</th><th>Buyer</th><th>Items</th><th>Total</th><th>Status</th><th>Runner</th><th>Actions</th></tr></thead>
        <tbody id="ordersBody"></tbody></table>
      </div>
    </section>

    <!-- Products -->
    <section id="tab-products" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <input id="productSearch" placeholder="Filter products…" class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-sm w-64" />
        <button onclick="openProductModal()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">+ Add product</button>
      </div>
      <div class="rounded-2xl bg-white border p-5 overflow-x-auto">
        <table class="w-full"><thead><tr><th></th><th>Name</th><th>Category</th><th>Seller</th><th>Marketplace</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
        <tbody id="productsBody"></tbody></table>
      </div>
    </section>

    <!-- Sellers / Runners / Nodes / Marketplaces (generic entity tables) -->
    <section id="tab-sellers" class="hidden"></section>
    <section id="tab-runners" class="hidden"></section>
    <section id="tab-nodes" class="hidden"></section>
    <section id="tab-marketplaces" class="hidden"></section>
  </main>
</div>

<!-- Product modal -->
<div id="productModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">
    <div class="text-lg font-semibold" id="productModalTitle">Add product</div>
    <form id="productForm" class="mt-4 space-y-3">
      <input type="hidden" name="_id" />
      <input name="name" required placeholder="Product name" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
      <div class="grid grid-cols-2 gap-3">
        <input name="price" required type="number" step="0.01" min="0" placeholder="Price (R)" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
        <input name="stock" type="number" min="0" placeholder="Stock" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input name="category" placeholder="Category" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
        <input name="emoji" placeholder="Emoji (e.g. 🌽)" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
      </div>
      <select name="seller_id" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white" id="sellerSelect"><option value="">— Seller —</option></select>
      <select name="marketplace_id" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white" id="marketplaceSelect"><option value="">— Marketplace (optional) —</option></select>
      <input name="image_url" placeholder="Image URL (optional)" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
      <div class="flex gap-3 pt-1">
        <button type="button" onclick="closeProductModal()" class="flex-1 px-4 py-2.5 rounded-xl border text-sm hover:bg-slate-100">Cancel</button>
        <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">Save</button>
      </div>
      <div id="productMsg" class="text-xs text-red-600"></div>
    </form>
  </div>
</div>

<!-- Generic entity modal -->
<div id="entityModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">
    <div class="text-lg font-semibold" id="entityModalTitle"></div>
    <form id="entityForm" class="mt-4 space-y-3"></form>
  </div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden"></div>

<script>
const R = v => "R" + Number(v || 0).toFixed(2);
let PIN = sessionStorage.getItem("yithume_pin") || "";
const H = () => ({ "Content-Type": "application/json", "X-Admin-Pin": PIN });
const STATUS_COLORS = { pending: "bg-amber-100 text-amber-700", confirmed: "bg-sky-100 text-sky-700", assigned: "bg-indigo-100 text-indigo-700", picked_up: "bg-violet-100 text-violet-700", delivered: "bg-emerald-100 text-emerald-700", cancelled: "bg-red-100 text-red-600" };
const NEXT_STATUS = { pending: "confirmed", confirmed: "assigned", assigned: "picked_up", picked_up: "delivered" };
const NEXT_LABEL = { confirmed: "Confirm ✅", assigned: "Assign 🏃", picked_up: "Picked up 📦", delivered: "Delivered 🎉" };
let CACHE = { sellers: [], runners: [], products: [], orders: [] };
let orderStatusFilter = "";

function toast(msg, ok = true) {
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast px-4 py-2.5 rounded-xl text-sm text-white shadow-lg ${ok ? "bg-slate-900" : "bg-red-600"}">${msg}</div>`;
  t.classList.remove("hidden");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add("hidden"), 2600);
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: H(), ...opts });
  const data = await res.json().catch(() => ({ ok: false, error: "bad response" }));
  if (res.status === 401) { lock(); throw new Error("unauthorized"); }
  if (!data.ok) { toast(data.error || "Request failed", false); throw new Error(data.error || "failed"); }
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- auth ----------
function lock() {
  PIN = ""; sessionStorage.removeItem("yithume_pin");
  document.getElementById("pinGate").classList.remove("hidden");
  document.getElementById("shell").classList.add("hidden");
}
async function tryUnlock(pin) {
  PIN = pin;
  try {
    const data = await fetch("/api/stats", { headers: H() }).then(r => { if (r.status === 401) throw 0; return r.json(); });
    sessionStorage.setItem("yithume_pin", pin);
    document.getElementById("pinGate").classList.add("hidden");
    document.getElementById("shell").classList.remove("hidden");
    document.getElementById("storageBadge").textContent = data.stats.storage;
    loadAll();
  } catch (e) {
    PIN = "";
    document.getElementById("pinMsg").textContent = "Wrong PIN — try again.";
  }
}
document.getElementById("pinBtn").onclick = () => tryUnlock(document.getElementById("pinInput").value.trim());
document.getElementById("pinInput").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("pinBtn").click(); });
document.getElementById("lockBtn").onclick = lock;

// ---------- tabs ----------
document.querySelectorAll("#tabs .tab-btn").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs .tab-btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll("main > section").forEach(s => s.classList.add("hidden"));
  document.getElementById("tab-" + b.dataset.tab).classList.remove("hidden");
});

// ---------- overview ----------
async function loadOverview() {
  const { stats } = await api("/api/stats");
  const cards = [
    ["GMV", R(stats.gmv)], ["Platform revenue", R(stats.platform_revenue)],
    ["Orders", stats.orders_total], ["Pending orders", stats.orders_by_status.pending || 0],
    ["Products", stats.products], ["Sellers", `${stats.sellers}${stats.sellers_pending ? ` (${stats.sellers_pending} pending)` : ""}`],
    ["Runners online", `${stats.runners_online}/${stats.runners}`], ["Markets connected", stats.marketplaces],
  ];
  document.getElementById("statCards").innerHTML = cards.map(([k, v]) =>
    `<div class="rounded-2xl bg-white border p-4"><div class="text-xs text-slate-500">${k}</div><div class="text-xl font-bold mt-1">${v}</div></div>`).join("");
  const total = Object.values(stats.orders_by_status).reduce((a, b) => a + b, 0) || 1;
  document.getElementById("statusBars").innerHTML = Object.entries(stats.orders_by_status).map(([s, n]) => `
    <div class="flex items-center gap-3 text-xs">
      <span class="w-20 text-slate-500">${s}</span>
      <div class="flex-1 h-3 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-emerald-500" style="width:${Math.round(n / total * 100)}%"></div></div>
      <b class="w-6 text-right">${n}</b>
    </div>`).join("") || `<div class="text-xs text-slate-400">No orders yet.</div>`;
  document.getElementById("topProducts").innerHTML = stats.top_products.map(p =>
    `<div class="flex justify-between"><span>${esc(p.name)}</span><b>${p.qty}×</b></div>`).join("") || `<div class="text-xs text-slate-400">No sales yet.</div>`;
  document.getElementById("recentOrders").innerHTML = stats.recent_orders.map(o => `
    <tr><td class="font-mono font-semibold">${o.code}</td><td>${esc(o.buyer.name)}</td><td>${o.items.length}</td><td>${R(o.total)}</td>
    <td><span class="status-pill ${STATUS_COLORS[o.status]}">${o.status}</span></td>
    <td class="text-slate-500">${new Date(o.created_at).toLocaleString()}</td></tr>`).join("") || `<tr><td colspan="6" class="text-slate-400">No orders yet.</td></tr>`;
}

// ---------- orders ----------
function renderOrderFilters() {
  const statuses = ["", "pending", "confirmed", "assigned", "picked_up", "delivered", "cancelled"];
  document.getElementById("orderFilters").innerHTML = statuses.map(s =>
    `<button onclick="setOrderFilter('${s}')" class="px-3 py-1.5 rounded-full border text-xs font-medium ${orderStatusFilter === s ? "bg-slate-900 text-white border-slate-900" : "bg-white hover:bg-slate-100"}">${s || "All"}</button>`).join("");
}
function setOrderFilter(s) { orderStatusFilter = s; loadOrders(); }

async function loadOrders() {
  renderOrderFilters();
  const { orders } = await api("/api/orders" + (orderStatusFilter ? `?status=${orderStatusFilter}` : ""));
  CACHE.orders = orders;
  const runnerOptions = CACHE.runners.filter(r => r.approved).map(r => `<option value="${r._id}">${esc(r.name)} (${r.status})</option>`).join("");
  document.getElementById("ordersBody").innerHTML = orders.map(o => {
    const next = NEXT_STATUS[o.status];
    let actions = "";
    if (o.status === "confirmed" && !o.runner_id) {
      actions += `<select id="rsel-${o._id}" class="px-2 py-1 rounded-lg border text-xs bg-white mr-1"><option value="auto">Auto-assign</option>${runnerOptions}</select>
        <button onclick="assignRunner('${o._id}')" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs">Assign 🏃</button>`;
    } else if (next) {
      actions += `<button onclick="advanceOrder('${o._id}','${next}')" class="px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs">${NEXT_LABEL[next]}</button>`;
    }
    if (!["delivered", "cancelled", "picked_up"].includes(o.status)) {
      actions += ` <button onclick="advanceOrder('${o._id}','cancelled')" class="px-2.5 py-1 rounded-lg border text-xs text-red-600 hover:bg-red-50">Cancel</button>`;
    }
    return `<tr>
      <td class="font-mono font-semibold">${o.code}</td>
      <td>${esc(o.buyer.name)}<div class="text-xs text-slate-400">${o.buyer.phone} • ${esc(o.buyer.area)}</div></td>
      <td class="text-xs">${o.items.map(i => `${i.qty}× ${esc(i.name)}`).join("<br>")}</td>
      <td>${R(o.total)}</td>
      <td><span class="status-pill ${STATUS_COLORS[o.status]}">${o.status}</span></td>
      <td>${esc(o.runner_name) || "—"}</td>
      <td class="whitespace-nowrap">${actions || "—"}</td></tr>`;
  }).join("") || `<tr><td colspan="7" class="text-slate-400">No orders${orderStatusFilter ? " with this status" : " yet"}.</td></tr>`;
}
async function advanceOrder(id, status) {
  await api(`/api/orders/${id}`, { method: "PATCH", body: JSON.stringify({ status }) });
  toast(`Order → ${status}`); loadOrders(); loadOverview();
}
async function assignRunner(id) {
  const sel = document.getElementById("rsel-" + id);
  await api(`/api/orders/${id}`, { method: "PATCH", body: JSON.stringify({ runner_id: sel.value, status: "assigned" }) });
  toast("Runner assigned 🏃"); loadOrders(); loadOverview();
}

// ---------- products ----------
async function loadProducts() {
  const { products } = await api("/api/products?all=1");
  CACHE.products = products;
  renderProducts();
}
function renderProducts() {
  const q = (document.getElementById("productSearch").value || "").toLowerCase();
  const items = CACHE.products.filter(p => !q || [p.name, p.category, p.seller_name].join(" ").toLowerCase().includes(q));
  document.getElementById("productsBody").innerHTML = items.map(p => `
    <tr>
      <td class="text-xl">${p.image_url ? `<img src="${esc(p.image_url)}" class="h-8 w-8 rounded object-cover">` : (p.emoji || "🛍️")}</td>
      <td class="font-medium">${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.seller_name)}</td><td>${esc(p.marketplace_name) || "—"}</td>
      <td>${R(p.price)}</td><td>${p.stock ?? "—"}</td>
      <td><button onclick="toggleProduct('${p._id}',${!p.active})" class="status-pill ${p.active ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${p.active ? "active" : "hidden"}</button></td>
      <td class="whitespace-nowrap">
        <button onclick="openProductModal('${p._id}')" class="px-2.5 py-1 rounded-lg border text-xs hover:bg-slate-100">Edit</button>
        <button onclick="deleteProduct('${p._id}')" class="px-2.5 py-1 rounded-lg border text-xs text-red-600 hover:bg-red-50">Delete</button>
      </td></tr>`).join("") || `<tr><td colspan="9" class="text-slate-400">No products.</td></tr>`;
}
document.getElementById("productSearch").oninput = renderProducts;

function openProductModal(id) {
  const modal = document.getElementById("productModal");
  const form = document.getElementById("productForm");
  form.reset(); form._id.value = id || "";
  document.getElementById("productModalTitle").textContent = id ? "Edit product" : "Add product";
  document.getElementById("sellerSelect").innerHTML = `<option value="">— Seller —</option>` +
    CACHE.sellers.map(s => `<option value="${s._id}">${esc(s.shop_name)}</option>`).join("");
  const mkts = CACHE.marketplaces || [];
  document.getElementById("marketplaceSelect").innerHTML = `<option value="">— Marketplace (optional) —</option>` +
    mkts.map(m => `<option value="${m._id}">${esc(m.name)}</option>`).join("");
  if (id) {
    const p = CACHE.products.find(x => x._id === id);
    for (const k of ["name", "price", "stock", "category", "emoji", "image_url"]) form[k].value = p[k] ?? "";
    form.seller_id.value = p.seller_id || ""; form.marketplace_id.value = p.marketplace_id || "";
  }
  modal.classList.remove("hidden"); modal.classList.add("flex");
}
function closeProductModal() { const m = document.getElementById("productModal"); m.classList.add("hidden"); m.classList.remove("flex"); }
document.getElementById("productForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const payload = { name: f.name.value, price: f.price.value, stock: f.stock.value || 0, category: f.category.value, emoji: f.emoji.value, image_url: f.image_url.value, seller_id: f.seller_id.value, marketplace_id: f.marketplace_id.value };
  if (f._id.value) await api(`/api/products/${f._id.value}`, { method: "PATCH", body: JSON.stringify(payload) });
  else await api("/api/products", { method: "POST", body: JSON.stringify(payload) });
  closeProductModal(); toast("Product saved"); loadProducts();
};
async function toggleProduct(id, active) { await api(`/api/products/${id}`, { method: "PATCH", body: JSON.stringify({ active }) }); loadProducts(); }
async function deleteProduct(id) { if (!confirm("Delete this product?")) return; await api(`/api/products/${id}`, { method: "DELETE" }); toast("Product deleted"); loadProducts(); }

// ---------- generic entities ----------
const ENTITIES = {
  sellers: { title: "Sellers", cols: [["shop_name", "Shop"], ["owner_name", "Owner"], ["phone", "Phone"], ["area", "Area"], ["approved", "Approved"]],
    fields: [["shop_name", "Shop name", "text"], ["owner_name", "Owner name", "text"], ["phone", "Phone", "text"], ["area", "Area", "text"]] },
  runners: { title: "Runners", cols: [["name", "Name"], ["phone", "Phone"], ["area", "Area"], ["vehicle", "Vehicle"], ["deliveries_done", "Drops"], ["status", "Status"], ["approved", "Approved"]],
    fields: [["name", "Name", "text"], ["phone", "Phone", "text"], ["area", "Area", "text"], ["vehicle", "Vehicle", "text"]] },
  nodes: { title: "Delivery nodes", cols: [["name", "Node"], ["operator_name", "Operator"], ["phone", "Phone"], ["territory", "Territory"], ["commission_rate", "Commission"], ["runners_count", "Runners"]],
    fields: [["name", "Node name", "text"], ["operator_name", "Operator", "text"], ["phone", "Phone", "text"], ["territory", "Territory", "text"], ["commission_rate", "Commission rate (e.g. 0.05)", "number"], ["runners_count", "Runners", "number"]] },
  marketplaces: { title: "Connected marketplaces", cols: [["name", "Market"], ["town", "Town"], ["contact_name", "Contact"], ["phone", "Phone"], ["status", "Status"]],
    fields: [["name", "Market name", "text"], ["town", "Town", "text"], ["contact_name", "Contact person", "text"], ["phone", "Phone", "text"]] },
};

async function loadEntity(entity) {
  const cfg = ENTITIES[entity];
  const data = await api(`/api/${entity}`);
  const items = data[entity] || [];
  CACHE[entity] = items;
  const cell = (item, key) => {
    if (key === "approved") return `<button onclick="patchEntity('${entity}','${item._id}',{approved:${!item.approved}})" class="status-pill ${item.approved ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}">${item.approved ? "approved" : "pending"}</button>`;
    if (key === "status" && entity === "runners") return `<button onclick="patchEntity('runners','${item._id}',{status:'${item.status === "online" ? "offline" : "online"}'})" class="status-pill ${item.status === "online" ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-500"}">${item.status}</button>`;
    if (key === "status" && entity === "marketplaces") return `<button onclick="patchEntity('marketplaces','${item._id}',{status:'${item.status === "connected" ? "pending" : "connected"}'})" class="status-pill ${item.status === "connected" ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}">${item.status}</button>`;
    if (key === "commission_rate") return (Number(item[key] || 0) * 100).toFixed(0) + "%";
    return esc(item[key]) || "—";
  };
  document.getElementById("tab-" + entity).innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <b>${cfg.title} <span class="text-slate-400 font-normal">(${items.length})</span></b>
      <button onclick="openEntityModal('${entity}')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">+ Add</button>
    </div>
    <div class="rounded-2xl bg-white border p-5 overflow-x-auto">
      <table class="w-full"><thead><tr>${cfg.cols.map(c => `<th>${c[1]}</th>`).join("")}<th></th></tr></thead>
      <tbody>${items.map(item => `<tr>${cfg.cols.map(c => `<td>${cell(item, c[0])}</td>`).join("")}
        <td class="whitespace-nowrap"><button onclick="deleteEntity('${entity}','${item._id}')" class="px-2.5 py-1 rounded-lg border text-xs text-red-600 hover:bg-red-50">Delete</button></td></tr>`).join("") ||
        `<tr><td colspan="${cfg.cols.length + 1}" class="text-slate-400">Nothing here yet.</td></tr>`}</tbody></table>
    </div>`;
}
async function patchEntity(entity, id, patch) {
  await api(`/api/${entity}/${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  loadEntity(entity); loadOverview();
}
async function deleteEntity(entity, id) {
  if (!confirm("Delete this record?")) return;
  await api(`/api/${entity}/${id}`, { method: "DELETE" });
  toast("Deleted"); loadEntity(entity); loadOverview();
}
function openEntityModal(entity) {
  const cfg = ENTITIES[entity];
  const modal = document.getElementById("entityModal");
  document.getElementById("entityModalTitle").textContent = "Add — " + cfg.title;
  const form = document.getElementById("entityForm");
  form.innerHTML = cfg.fields.map(([k, label, type]) =>
    `<input name="${k}" type="${type}" ${type === "number" ? 'step="any"' : ""} placeholder="${label}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />`).join("") +
    `<div class="flex gap-3 pt-1">
      <button type="button" onclick="closeEntityModal()" class="flex-1 px-4 py-2.5 rounded-xl border text-sm hover:bg-slate-100">Cancel</button>
      <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700">Save</button>
    </div>`;
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const payload = Object.fromEntries(new FormData(form).entries());
    await api(`/api/${entity}`, { method: "POST", body: JSON.stringify(payload) });
    closeEntityModal(); toast("Saved"); loadEntity(entity); loadOverview();
  };
  modal.classList.remove("hidden"); modal.classList.add("flex");
}
function closeEntityModal() { const m = document.getElementById("entityModal"); m.classList.add("hidden"); m.classList.remove("flex"); }

// ---------- boot ----------
async function loadAll() {
  await Promise.all([loadEntity("sellers"), loadEntity("runners"), loadEntity("nodes"), loadEntity("marketplaces")]);
  await Promise.all([loadOverview(), loadOrders(), loadProducts()]);
}
if (PIN) tryUnlock(PIN);
</script>
