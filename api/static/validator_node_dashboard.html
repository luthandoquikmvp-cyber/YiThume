<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YiThume Validator Node Dashboard</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b1220;color:#e6eefc}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .card{background:#111a2e;border:1px solid #1f2a44;border-radius:14px;padding:14px;margin:12px 0}
    input,textarea,button{width:100%;font-size:16px;border-radius:10px;border:1px solid #2a3960;background:#0e1730;color:#e6eefc;padding:10px;box-sizing:border-box}
    textarea{min-height:120px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    button{background:#1d4ed8;border:0;padding:12px;font-weight:700}
    button.secondary{background:#334155}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .kpi{background:#0e1730;border:1px solid #1f2a44;border-radius:12px;padding:10px}
    .muted{color:#9bb0d1}
    .log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}
    @media (max-width:720px){.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h2 style="margin:6px 0 0">Validator Node Dashboard</h2>
    <div class="muted" style="margin:6px 0 14px">Poll jobs → validate deterministically → submit signed result.</div>

    <div class="card">
      <div class="row">
        <div>
          <label class="muted">Node ID</label>
          <input id="nodeId" placeholder="node_..." />
        </div>
        <div>
          <label class="muted">Node Signing Key</label>
          <input id="nodeSecret" placeholder="paste node_signing_key from admin registration" />
        </div>
      </div>
      <div style="margin-top:10px" class="row">
        <button class="secondary" id="saveCreds">Save</button>
        <button id="refreshSummary">Refresh Summary</button>
      </div>
    </div>

    <div class="card">
      <div class="kpis">
        <div class="kpi"><div class="muted">Total earnings</div><div id="kEarnings" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Validations</div><div id="kValidations" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Pending commissions</div><div id="kPending" style="font-size:20px;font-weight:800">—</div></div>
        <div class="kpi"><div class="muted">Reputation</div><div id="kRep" style="font-size:20px;font-weight:800">—</div></div>
      </div>
    </div>

    <div class="card">
      <button id="pollJob">Poll next job</button>
      <div id="jobBox" class="log" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="muted">Validation result (must be deterministic JSON)</div>
      <textarea id="resultJson">{}</textarea>
      <button style="margin-top:10px" id="submitValidation">Submit validation</button>
      <div id="submitBox" class="log" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="muted">Log</div>
      <div id="log" class="log"></div>
    </div>
  </div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const log = (m)=>{ $('log').textContent = (new Date()).toISOString() + "  " + m + "\n" + $('log').textContent; };

  const loadCreds = ()=>{
    $('nodeId').value = localStorage.getItem('validator_node_id') || '';
    $('nodeSecret').value = localStorage.getItem('validator_node_secret') || '';
  };

  const saveCreds = ()=>{
    localStorage.setItem('validator_node_id', $('nodeId').value.trim());
    localStorage.setItem('validator_node_secret', $('nodeSecret').value.trim());
    log("Saved node credentials to localStorage.");
  };

  const signHeaders = async (bodyText)=>{
    const nodeId = (localStorage.getItem('validator_node_id')||'').trim();
    const nodeSecret = (localStorage.getItem('validator_node_secret')||'').trim();
    if(!nodeId || !nodeSecret) throw new Error("Missing node creds");
    const ts = Math.floor(Date.now()/1000).toString();
    const nonce = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);

    const key = nodeSecret;

    const msg = ts + "." + nonce + "." + bodyText;
    const enc = new TextEncoder();
    const keyData = enc.encode(key);
    const msgData = enc.encode(msg);

    // WebCrypto HMAC
    const cryptoKey = await crypto.subtle.importKey("raw", keyData, {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
    const sigBuf = await crypto.subtle.sign("HMAC", cryptoKey, msgData);
    const sigArr = Array.from(new Uint8Array(sigBuf));
    const sigHex = sigArr.map(b=>b.toString(16).padStart(2,'0')).join('');

    return {
      "X-Node-Id": nodeId,
      "X-Node-TS": ts,
      "X-Node-Nonce": nonce,
      "X-Node-Signature": sigHex,
      "Content-Type": "application/json"
    };
  };

  let lastJob = null;

  const refreshSummary = async ()=>{
    const body = "{}";
    const headers = await signHeaders(body);
    const res = await fetch("/v1/validator/node/summary", {method:"POST", headers, body});
    const j = await res.json();
    if(!j.ok){ throw new Error(j.error||"summary failed"); }
    $('kEarnings').textContent = j.total_earnings;
    $('kValidations').textContent = j.total_validations;
    $('kPending').textContent = j.pending_commissions;
    $('kRep').textContent = j.reputation_score;
    log("Summary refreshed.");
  };

  const pollJob = async ()=>{
    const body = "{}";
    const headers = await signHeaders(body);
    const res = await fetch("/v1/validator/jobs/poll", {method:"POST", headers, body});
    const j = await res.json();
    if(!j.ok){ throw new Error(j.error||"poll failed"); }
    lastJob = j.job;
    $('jobBox').textContent = JSON.stringify(j.job, null, 2);
    if(j.job){
      // seed result template
      $('resultJson').value = JSON.stringify({
        subject_type: j.job.subject_type,
        subject_id: j.job.subject_id,
        snapshot_hash: j.job.snapshot_hash,
        checks: [],
        ok: true,
        notes: ""
      }, null, 2);
      log("Job assigned: " + j.job.job_id);
    } else {
      log("No job available.");
    }
  };

  const submitValidation = async ()=>{
    if(!lastJob){ throw new Error("No job to submit"); }
    let result;
    try { result = JSON.parse($('resultJson').value); }
    catch(e){ throw new Error("Result JSON invalid"); }

    const payload = {
      round_id: lastJob.round_id,
      subject_type: lastJob.subject_type,
      subject_id: lastJob.subject_id,
      snapshot_hash: lastJob.snapshot_hash,
      result: result
    };
    const body = JSON.stringify(payload);
    const headers = await signHeaders(body);
    const res = await fetch("/v1/validator/validations/submit", {method:"POST", headers, body});
    const j = await res.json();
    $('submitBox').textContent = JSON.stringify(j, null, 2);
    if(!j.ok){ throw new Error(j.error||"submit failed"); }
    log("Submitted validation. Hash=" + j.validation_hash);
  };

  $('saveCreds').addEventListener('click', ()=>{ saveCreds(); });
  $('refreshSummary').addEventListener('click', ()=>{ refreshSummary().catch(e=>log("ERR: "+e.message)); });
  $('pollJob').addEventListener('click', ()=>{ pollJob().catch(e=>log("ERR: "+e.message)); });
  $('submitValidation').addEventListener('click', ()=>{ submitValidation().catch(e=>log("ERR: "+e.message)); });

  loadCreds();
})();
</script>
</body>
</html>
